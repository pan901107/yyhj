<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>证书查询结果</title>
<style>
  :root {
    --page-bg:   #ffffff;
    --card-bg:   #ffffff;
    --head-bg:   #f5f5f5;
    --line:      #e5e5e5;
    --line-soft: #ededed;
    --text:      #333333;
    --text-sub:  #666666;
    --accent:    #2f6fb5;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 16px 20px 60px;
    background: var(--page-bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 "Source Han Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ===================== 卡片 1：证书查询结果 ===================== */
  .page-title {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 0 26px;
    background: var(--head-bg);
    border: 1px solid var(--line);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    font-size: 17px;
    letter-spacing: .5px;
  }

  /* ===================== 卡片 2：证书明细 ===================== */
  .wrap { max-width: 1280px; }

  .cert {
    max-width: 900px;
    margin: 40px auto 0;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 2px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .07);
    overflow: hidden;
  }

  .cert__caption {
    padding: 11px 12px;
    background: var(--head-bg);
    border-bottom: 1px solid var(--line);
    font-size: 17px;
    color: var(--text);
  }

  .cert__row {
    display: grid;
    grid-template-columns: 100px minmax(140px, 1fr) 82px minmax(0, 1.6fr);
    column-gap: 10px;
    align-items: center;
    min-height: 48px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line-soft);
  }

  .cert__row:last-child { border-bottom: 0; }

  .cert__label { color: var(--text-sub); }

  .cert__value {
    color: var(--text);
    word-break: break-all;
  }

  /* 身份证等需要等宽数字的字段 */
  .cert__value--mono {
    font-family: ui-monospace, Consolas, "SFMono-Regular", Menlo, monospace;
    letter-spacing: .5px;
  }

  /* ===================== 小屏适配：改为两行一组 ===================== */
  @media (max-width: 760px) {
    body { padding: 12px 12px 40px; font-size: 16px; }

    .page-title { padding: 0 16px; font-size: 16px; }

    .cert { max-width: 100%; margin-top: 20px; }

    .cert__caption { font-size: 16px; }

    .cert__row {
      grid-template-columns: 96px minmax(0, 1fr);
      row-gap: 2px;
      padding: 8px 12px;
    }

    /* 第 3、4 列换到下一行 */
    .cert__row > :nth-child(3) { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

  <!-- 页头 -->
  <header class="page-title">证书查询结果</header>

  <div class="wrap">
    <!-- 证书明细卡片 -->
    <section class="cert" aria-label="证书明细">
      <div class="cert__caption">浙江省初中级专业技术职务任职资格证书</div>

      <div class="cert__row">
        <span class="cert__label">姓名：</span>
        <span class="cert__value">*玉</span>
        <span class="cert__label">身份证号：</span>
        <span class="cert__value cert__value--mono">6****************X</span>
      </div>

      <div class="cert__row">
        <span class="cert__label">资格名称：</span>
        <span class="cert__value">工程师</span>
        <span class="cert__label">专业名称：</span>
        <span class="cert__value">建筑结构</span>
      </div>

      <div class="cert__row">
        <span class="cert__label">取得资格时间：</span>
        <span class="cert__value">2022年10月28日</span>
        <span class="cert__label">评委会名称：</span>
        <span class="cert__value">杭州市滨江区建设工程技术人员工程师资格评审委员会</span>
      </div>
    </section>
  </div>

</body>
</html>
